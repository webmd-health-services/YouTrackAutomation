version: 0.0.0+{build}

skip_tags: true

skip_branch_with_pr: true

build:
  verbosity: minimal

test: off

environment:
  WHISKEY_DISABLE_ERROR_FORMAT: True
  matrix:
  - job_name: PowerShell on Windows 2022
    job_group: pwsh
    appveyor_build_worker_image: Visual Studio 2022

  - job_name: PowerShell on macOS
    job_group: pwsh
    appveyor_build_worker_image: macOS

  # PowerShellGet 2.2.5 downloads its version of NuGet.exe from the internet, and that version was updated to NuGet 7,
  # which requires .NET standard, so won't run on a server with .NET 4.6.2 installed. Any build that publishes with
  # PowerShellGet will fail on these servers. This may be a permanent change or maybe it was a mistake. Follow
  # https://github.com/PowerShell/PSResourceGet/issues/1905 for updates
  # - job_name: Windows PowerShell 5.1/.NET 4.6.2
  #   job_group: ps
  #   appveyor_build_worker_image: Visual Studio 2013

  - job_name: Windows PowerShell on Windows 2019
    job_group: ps
    appveyor_build_worker_image: Visual Studio 2019

  - job_name: Windows PowerShell on Windows 2022
    job_group: ps
    appveyor_build_worker_image: Visual Studio 2022

  # YouTrack fails to start on this VM.
  # - job_name: PowerShell 6.2 on Windows
  #   job_group: pwsh
  #   appveyor_build_worker_image: Visual Studio 2015

  - job_name: PowerShell on Ubuntu
    job_group: pwsh
    appveyor_build_worker_image: Ubuntu

  - job_name: PowerShell on Windows 2019
    job_group: pwsh
    appveyor_build_worker_image: Visual Studio 2019

artifacts:
- path: .output\*

for:
# Build in Windows PowerShell
- matrix:
    only:
    - job_group: ps
  build_script:
  - ps: &enable_rdp |
      $PSVersionTable
      if ((Test-Path -Path 'variable:IsWindows') -and -not $IsWindows)
      {
        return
      }

      if ((Test-Path -Path 'env:ENABLE_RDP') -and $env:ENABLE_RDP -eq 'True')
      {
        $blockRdp = $false
        if ((Test-Path -Path 'env:BLOCK_RDP') -and $env:BLOCK_RDP -eq 'True')
        {
          $blockRdp = $true
        }
        $nonat = $false
        iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/appveyor/ci/master/scripts/enable-rdp.ps1'))
      }
  - ps: &install_youtrack |
      .\init.ps1
  - ps: &build_script |
      $ProgressPreference = 'SilentlyContinue'
      iwr https://raw.githubusercontent.com/webmd-health-services/Prism/main/Scripts/init.ps1 | iex | Format-Table
      .\build.ps1
  on_finish:
  - ps: *enable_rdp

# Build in PowerShell
- matrix:
    only:
    - job_group: pwsh
  build_script:
  - pwsh: *enable_rdp
  - pwsh: *install_youtrack
  - pwsh: *build_script
  on_finish:
  - pwsh: *enable_rdp
